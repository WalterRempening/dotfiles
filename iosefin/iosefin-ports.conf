# Project port registry for iosefin sync
# Format: repo_relative_path:domain:app_port:slot
#
# Port allocation for worktrees:
#   app_port  = main_app_port + offset    (where offset = (slot*3 + wt_index) * 100)
#   all docker ports are offset by the same amount
#   e.g. hopninj (slot 0) WT1: offset=100, WT2: offset=200, WT3: offset=300
#        senova  (slot 1) WT1: offset=400, WT2: offset=500, WT3: offset=600
#
# app_port=0 means no web server (backend-only / library)

hopninj/skola-hopninj-app:hopninj:8081:0
senova/senova-pos:senova:8083:1
sbs/sbs-api:sbs-api:8080:2
sbs/sbs-ui:sbs:3000:3
kassa/kassa-pos-web:kassa:8085:4
infra/faktura:faktura:8086:5
infra/slant:slant:8087:6
infra/snack:snack:8088:7
unecre/api_point_of_sale:unecre-api:5190:8
unecre/web_point_of_sale:unecre:3001:9
menoserv/buakfieren-app:buakfieren:8082:10
infra/keycloak:auth:8089:11
chopin/chopin-app:chopin:8090:12
tikjetgo/tikjetgo-app:tikjetgo:8091:13
tikjetgo/hoafstfest-web:hoafstfest:8092:14
skola/skola-app:skola:8093:15

# The WordPress sites and the MariaDB they share. All three live under
# sbs/sbs-db-wp-env: the two site repos are checked out inside the database
# repo's directory, which is why these paths are one level deeper than the rest.
# The db entry's app_port is its Adminer (both databases); MariaDB itself is on
# 3307 and has no domain — nothing but host tools should reach it.
#
# ibus-wp is a reservation: the directory exists but is still empty. Until a
# real repo is cloned into it, `git -C ibus-wp worktree list` resolves to the
# ENCLOSING sbs-db-wp-env repo, so sync also emits a stale ibus-wp.main.test
# route. Harmless, and it disappears once the repo is there.
sbs/sbs-db-wp-env/sbs-wp:sbs-wp:8094:16
sbs/sbs-db-wp-env:sbs-wp-db:8095:17
sbs/sbs-db-wp-env/ibus-wp:ibus-wp:8096:18
