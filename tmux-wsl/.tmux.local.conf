# ---------------------------------------------------------------------------
# Machine-local tmux overrides — Linux only.
#
# Stowed by install-wsl.sh from the `tmux-wsl` package, so it exists only on
# Linux boxes. tmux/.tmux.conf ends with `source-file -q ~/.tmux.local.conf`,
# and -q means the laptop simply skips it.
#
# Purpose: give the home server a visually distinct status bar so it can never
# be mistaken for the laptop's at a glance.
# ---------------------------------------------------------------------------

# ristretto: warm grey #3a383b bar, coral #f38d70 session block — the laptop
# runs tokyo-night/night, which is cool navy #292e42 with a green #9ece6a
# session block.
#
# The variant must be reset too: the shared config sets 'night' for
# tokyo-night, but ristretto ships only a 'default' variant, and a variant
# that does not exist would fail to resolve.
set -g @powerkit_theme 'ristretto'
set -g @powerkit_theme_variant 'default'
