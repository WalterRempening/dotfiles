# List of plugins
unbind r
bind r source-file ~/.tmux.conf

unbind s
bind S choose-tree -s

bind -T copy-mode-vi v send-keys -X begin-selection

# Clipboard. macOS pipes to pbcopy; Linux has no pbcopy and the T14 is headless,
# so it falls back to OSC 52 — tmux hands the copy to the terminal emulator,
# which puts it on the clipboard of whatever machine you are sitting at.
set -g set-clipboard on
if-shell 'uname | grep -q Darwin' {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
} {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
}
# fuzzy switch to another sesion
bind s display-popup -w 90% -h 90% -E "tmux list-sessions -F '#{session_name}' | fzf --ansi --preview 'for pane in \$(tmux list-panes -s -t {} -F \"#S:#I.#P\"); do printf \"\\033[46;30;1m %-40s \\033[0m\\n\" \"\$pane\"; tmux capture-pane -t \"\$pane\" -p -e | head -12; echo; done' | xargs tmux switch-client -t"
# Prompt for a shell
bind P display-popup -w 90% -h 90% -E "$SHELL"
# Switch Windows through fuzzy finder
bind-key W run-shell 'tmux list-windows | fzf --tmux | cut -c -1 | xargs -tI{} tmux select-window -t :{}'
# ── ccmux: jump between AI agent sessions ────────────────────────────────────
# prefix + a : fuzzy-find sessions in a popup (/ to search, Enter jumps, closes)
bind-key a display-popup -E -w 80% -h 75% "ccmux picker"
# prefix + g: glab tui popup on current project
bind-key g display-popup -E -w 80% -h 75% "glab-tui"

# vim  like pane  switching
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# New panes open in the current pane's directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# New windows open in the current window's directory
bind c new-window -c "#{pane_current_path}"

# automatic reordering of indexes
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g prefix C-a
set -g mouse on
setw -g mode-keys vi

# Extended keys: let TUIs (e.g. pi) see modified Enter (Shift/Alt+Enter) etc.
# `extended-keys on` forwards them to apps; terminal-features tells the outer
# terminal tmux can request the extended (CSI u) encoding.
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Truecolor. Ghostty advertises itself as xterm-ghostty and tmux enables RGB
# for it automatically, but over SSH a remote tmux only sees xterm-256color and
# quantises PowerKit's hex colours to the 256-colour palette. We only ever
# attach from a truecolor terminal, so declare it for every terminal name.
set -as terminal-features ',*:RGB'
set -g extended-keys-format csi-u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'sainnhe/tmux-fzf'
# Use zsh as default shell (starship)
set-option -g default-shell /bin/zsh
# Skip PowerKit keybindings that conflict with our bindings
set -g @powerkit_keybinding_conflict_action 'skip'
# PowerKit (Tokyo Night) Theme configuration
set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'
set -g @powerkit_plugins 'ccmux,cpu,memory,netspeed,ssh'
# ccmux status plugin: waiting·working·idle agent counts
set -g @powerkit_plugin_ccmux_format 'full'
set -g @powerkit_separator_style 'rounded'
set -g @powerkit_transparent 'true'
set -g @powerkit_status_position 'top'
# Option names are @powerkit_plugin_<plugin>_<option>; this was missing the
# _format suffix and had always been a no-op.
set -g @powerkit_plugin_memory_format 'usage'

# PowerKit needs Bash 4+ features (declare -g, ${var^^}): on macOS that means
# Homebrew's bash first; on Linux the system bash is already 5.x but
# ~/.local/bin must be present for starship/mise/ccmux.
#
# One unconditional line on purpose. tmux expands $HOME in a double-quoted
# config string, and a path that does not exist on a given machine is simply
# ignored — so no if-shell is needed. That matters: if-shell in a config file
# runs DEFERRED, which would let tpm load plugins before PATH was set.
set-environment -g PATH "/opt/homebrew/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override PowerKit popup background to be transparent
set -g popup-style 'bg=default'
set -g popup-border-style 'fg=#7aa2f7'
